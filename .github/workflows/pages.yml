name: Обновление GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Подготовить файлы сайта
        run: |
          rm -rf pages-dist
          mkdir pages-dist
          cp -R client/. pages-dist/

      - name: Опубликовать в gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git switch --orphan gh-pages-publish
          find . -mindepth 1 -maxdepth 1 ! -name pages-dist ! -name .git -exec rm -rf {} +
          cp -R pages-dist/. .
          rm -rf pages-dist
          touch .nojekyll
          git add -A
          git commit -m "Обновить GitHub Pages" || exit 0
          git push --force origin gh-pages-publish:gh-pages
